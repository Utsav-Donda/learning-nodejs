name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Matches package.json's declared "engines" floor (>=18.0.0)
        # plus the current LTS lines. 18.x is what actually exercises
        # that floor — env-config-demo's config.js needs Node 20.6+ for
        # process.loadEnvFile, but it guards for older Node explicitly
        # (see config.test.js) rather than requiring the whole repo to
        # raise its floor for one demo's optional feature.
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci (not npm install) for reproducible installs from the
      # committed lockfile — see topics/02-modules-npm/semver-cheatsheet.md.
      - run: npm ci

      - run: npm test
