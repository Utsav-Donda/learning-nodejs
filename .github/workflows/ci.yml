name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Covers the floor declared in package.json's "engines" field
        # (>=18.0.0) plus the currently-active LTS lines, so CI would
        # actually catch a Node-18-only incompatibility instead of
        # letting the documented support floor go untested.
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci (not npm install) for reproducible installs from the
      # committed lockfile — see topics/02-modules-npm/semver-cheatsheet.md.
      - run: npm ci

      - run: npm test
