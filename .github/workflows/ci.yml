name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # package.json's "engines" floor (>=18.0.0) applies to the repo
        # as a whole; individual demos can need more (e.g. topic 13's
        # env-config-demo needs 20.6+ for process.loadEnvFile — noted
        # in its own README/comments rather than raised globally, since
        # the rest of the curriculum doesn't need it). This matrix just
        # tests the current LTS lines, which happen to cover that case.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci (not npm install) for reproducible installs from the
      # committed lockfile — see topics/02-modules-npm/semver-cheatsheet.md.
      - run: npm ci

      - run: npm test
