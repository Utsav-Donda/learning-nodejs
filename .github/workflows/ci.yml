name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Matches the floor declared in package.json's "engines" field
        # (>=20.6.0, required by env-config-demo's use of
        # process.loadEnvFile) plus the current LTS line.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci (not npm install) for reproducible installs from the
      # committed lockfile — see topics/02-modules-npm/semver-cheatsheet.md.
      - run: npm ci

      - run: npm test
